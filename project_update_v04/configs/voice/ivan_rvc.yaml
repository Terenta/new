schema_version: 1
voice_job_id: ivan_grozny_rvc_pilot_001
backend: rvc
gpu_profile: rtx_pro_6000_96gb
character_id: ivan_grozny_1973
rights_manifest: configs/rights_manifest.local.yaml
model_registry: configs/model_registry.yaml
runtime_model_lock: configs/model_registry.runtime.lock.yaml

dataset:
  source_asset_id: character_voice_source
  observed_content_end_seconds: 85.8
  curation_manifest: configs/voice/ivan_rvc_curation.yaml
  curated_experiment: ivan_grozny_pilot_curated
