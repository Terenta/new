  output: data/voice/ivan_grozny_1973/converted_exact_timing.wav
  pitch_semitones: 0
  f0_method: rmvpe
  index_rate: 0.65
  resample_sr: 48000
  rms_mix_rate: 0.85
  protect: 0.33
  preserve_exact_timing: true
  overwrite: false

approval:
  dataset: true
  checkpoint_abx: false
  converted_line: false
